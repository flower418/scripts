# Qwen2.5-1.5B SFT 配置
model: "./Qwen2.5-1.5B"
data: "./data/sft_chat_22k.jsonl"
output_dir: "./output/sft_22k"

# 训练超参
batch_size: 2
gradient_accumulation_steps: 4
epochs: 3
lr: 2.0e-5
warmup_ratio: 0.05
lr_scheduler_type: "cosine"
max_seq_length: 2048
packing: true
bf16: true

# 日志 & 保存
logging_steps: 10
save_steps: 200
save_total_limit: 2
report_to: "wandb"
run_name: "qwen2.5-1.5b-sft"
